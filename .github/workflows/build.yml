name: Build V31 FINAL QRIS BISA BAYAR
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix android if broken
        run: |
          if [ ! -f android/app/build.gradle ]; then
            cp lib/main.dart /tmp/m.dart
            cp pubspec.yaml /tmp/p.yaml
            mkdir -p /tmp/as
            cp assets/qris.png /tmp/as/ 2>/dev/null || true
            rm -rf android
            flutter create . --platforms=android --org com.supercoder.academy --project-name supercoder_academy
            cp /tmp/m.dart lib/main.dart
            cp /tmp/p.yaml pubspec.yaml
            mkdir -p assets
            cp /tmp/as/qris.png assets/ 2>/dev/null || true
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: APK-V31-QRIS-BU-SINTA-BISA-BAYAR
          path: build/app/outputs/flutter-apk/app-release.apk
