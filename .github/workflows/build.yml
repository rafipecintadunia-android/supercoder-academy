name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python 3.10 & JDK 17
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk zip unzip libncurses5-dev libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv

      - name: Build APK with Buildozer Action (AUTO LICENSE)
        uses: digreat/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: stable
          command: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Supercoder-APK
          path: bin/*.apk
