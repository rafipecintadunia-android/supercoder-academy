name: Build APK - Flutter Copilot v2
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.5' }
      - name: Install PIL
        run: pip install pillow
      - name: Generate Icon PNG
        run: |
          mkdir -p assets
          python gen_icon.py
          cat assets/icon.png | head -c 10
      - name: Setup Launcher Icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons
      - name: Create Flutter Project + Build APK
        run: |
          flutter create . --platforms=android --project-name supercoder_academy --org com.rafisupercoder
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with: { name: Supercoder-APK-JADI, path: build/app/outputs/flutter-apk/app-debug.apk }
