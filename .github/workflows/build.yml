name: Build APK - Flutter Copilot v2
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter - COPILOT ACTIVE
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Create Flutter Project + Build APK
        run: |
          flutter create --project-name supercoder_academy . || true
          cp lib/main.dart /tmp/main.dart
          flutter create --project-name supercoder_academy . || true
          cp /tmp/main.dart lib/main.dart
          flutter pub get
          flutter build apk --debug --verbose
      - name: Upload APK JADI
        uses: actions/upload-artifact@v4
        with:
          name: Supercoder-APK-JADI
          path: build/app/outputs/flutter-apk/app-debug.apk
