name: Build APK - Flet Copilot
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-flutter@v1
        with:
          channel: stable
          version: '3.22.0'
      - name: Install Flet & Build APK
        run: |
          pip install flet
          flet build apk --verbose
      - name: Upload APK Langsung Jadi
        uses: actions/upload-artifact@v4
        with:
          name: Supercoder-APK-Flet
          path: build/apk
